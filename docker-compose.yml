
name: quickdrop

services:
  # Existing PaySwift sandbox — unchanged
  payswift:
    build: ./payswift
    ports:
      - "8081:8081"

  # PostgreSQL — persistent application database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quickdrop}
      POSTGRES_USER: ${POSTGRES_USER:-quickdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Redis — caching, Pub/Sub, transient events
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  # Shared image and container-only connection settings.
  api: &backend
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-quickdrop}
      POSTGRES_USER: ${POSTGRES_USER:-quickdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: ""
      REDIS_URL: redis://redis:6379/0
      PAYSWIFT_BASE_URL: http://payswift:8081
      PAYMENT_POLL_SECONDS: ${PAYMENT_POLL_SECONDS:-2}
      PAYMENT_MAX_ATTEMPTS: ${PAYMENT_MAX_ATTEMPTS:-8}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      provider-ready:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    ports: []
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  provider-ready:
    <<: *backend
    command: ["python", "-m", "app.scripts.wait_provider"]
    restart: "no"
    ports: []
    healthcheck:
      disable: true
    depends_on:
      payswift:
        condition: service_started

  worker:
    <<: *backend
    command: ["python", "-m", "app.workers.main"]
    ports: []
    healthcheck:
      disable: true

  # Explicit, repeatable import. Never runs automatically against persistent data.
  seed:
    <<: *backend
    command: ["python", "-m", "app.scripts.seed"]
    restart: "no"
    profiles: ["setup"]
    ports: []
    healthcheck:
      disable: true

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
