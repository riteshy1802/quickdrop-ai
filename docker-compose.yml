
name: quickdrop

services:
  # Existing PaySwift sandbox — unchanged
  payswift:
    build: ./payswift
    ports:
      - "8081:8081"

  # PostgreSQL — persistent application database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quickdrop}
      POSTGRES_USER: ${POSTGRES_USER:-quickdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Redis — caching, Pub/Sub, transient events
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Durable payment worker; apply backend migrations before starting it.
  worker:
    build: ./backend
    command: ["python", "-m", "app.workers.main"]
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-quickdrop}
      POSTGRES_USER: ${POSTGRES_USER:-quickdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: ""
      PAYSWIFT_BASE_URL: http://payswift:8081
      PAYMENT_POLL_SECONDS: ${PAYMENT_POLL_SECONDS:-2}
      PAYMENT_MAX_ATTEMPTS: ${PAYMENT_MAX_ATTEMPTS:-8}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      payswift:
        condition: service_started

networks:
  default:
    name: quickdrop-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
