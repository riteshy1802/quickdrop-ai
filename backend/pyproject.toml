[project]
name = "quickdrop-backend"
version = "0.1.0"
description = "QuickDrop AI database foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.43,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.16,<2",
    "pydantic-settings>=2.10,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "httpx>=0.28,<1",
    "langgraph>=1,<2",
    "langchain-groq>=1,<2",
    "langchain-core>=1,<2",
    "argon2-cffi>=25.1,<26",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["database: requires an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
