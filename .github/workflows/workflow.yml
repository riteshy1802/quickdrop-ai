name: QuickDrop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Explicit Bash enables pipefail as well as fail-fast execution.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.26'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies including development tools
        run: uv sync --locked --group dev
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff formatting check
        run: uv run --locked ruff format --check .
      - name: Unit tests (no PostgreSQL required)
        run: uv run --locked pytest -q -m 'not database'

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build

  database-validation:
    name: PostgreSQL and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # Disposable service credentials only; never use repository or deployment secrets.
    env:
      DATABASE_URL: postgresql+asyncpg://quickdrop_ci:ci_only_password@127.0.0.1:5432/quickdrop_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quickdrop_ci
          POSTGRES_USER: quickdrop_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quickdrop_ci -d quickdrop_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.26'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Apply migrations
        run: uv run --locked alembic upgrade head
      - name: Verify current revision matches the single head
        run: |
          uv run --locked alembic current
          uv run --locked alembic heads
          uv run --locked python - <<'PY'
          import asyncio
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from app.core.database import get_engine

          async def verify():
              heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads()
              assert len(heads) == 1, f'Expected one migration head, got {heads}'
              engine = get_engine()
              try:
                  async with engine.connect() as connection:
                      current = await connection.run_sync(
                          lambda conn: MigrationContext.configure(conn).get_current_heads()
                      )
                  assert set(current) == set(heads), f'{current} does not match {heads}'
              finally:
                  await engine.dispose()

          asyncio.run(verify())
          PY
      - name: Verify schema matches models
        run: uv run --locked alembic check
      - name: PostgreSQL integration tests
        # The service role may create the unique disposable databases used by the fixtures.
        run: uv run --locked pytest -q -m database

